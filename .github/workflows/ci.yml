name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run repository checks
        run: nix develop --accept-flake-config --command bash scripts/check.sh

      - name: Run isolated sandbox suite
        run: nix develop --accept-flake-config --command bash scripts/test-isolated.sh

      - name: Verify bootstrap and installer integration suites explicitly
        run: |
          bash tests/bootstrap/test-bootstrap.sh
          bash tests/installer/test-installer-mock.sh
