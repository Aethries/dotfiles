# ==============================================================================
# Herdr Configuration (Noctalia Ecosystem Sync)
# ==============================================================================

onboarding = false

# ------------------------------------------------------------------------------
# Session Persistence & Layout Auto-Restore
# ------------------------------------------------------------------------------
[session]
resume_agents_on_restore = true
startup_per_agent_delay_ms = 100

[experimental]
pane_history = true

[ui.toast]
delivery = "system"

[ui]
status_indicators = "symbols"

[ui.sound]
enabled = true

# ------------------------------------------------------------------------------
# Theme (Synced with Noctalia Palette & Transparent Ghostty Glass)
# ------------------------------------------------------------------------------
[theme]
name = "terminal"

[theme.custom]
accent = "#78c4ce"
sidebar_bg = "none"
panel_bg = "none"
active_row_bg = "#282c34"
selection_bg = "#393e47"
surface0 = "#282c34"
surface1 = "#393e47"
text = "#e6e6e6"
subtext0 = "#c9ccd3"
red = "#e27881"
green = "#98c379"
yellow = "#eac786"
blue = "#71b9f4"
teal = "#62bac6"
mauve = "#c88bda"
peach = "#e2a478"

# ------------------------------------------------------------------------------
# Keybindings (Neovim-Centric & Direct Navigation)
# ------------------------------------------------------------------------------
[keys]
prefix = "ctrl+space"

# 1. Điều hướng & Quản lý Pane
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

split_vertical = "alt+v"
split_horizontal = "alt+s"
close_pane = "alt+w"
zoom = "alt+z"
resize_mode = "alt+r"

swap_pane_left = "alt+shift+left"
swap_pane_right = "alt+shift+right"
swap_pane_up = "alt+shift+up"
swap_pane_down = "alt+shift+down"

# 2. Quản lý Tab
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
move_tab_previous = "alt+ctrl+h"
move_tab_next = "alt+ctrl+l"
new_tab = "alt+t"
close_tab = "alt+q"
switch_tab = "alt+1..9"

# 3. Quản lý Workspace
previous_workspace = "alt+["
next_workspace = "alt+]"
new_workspace = "alt+shift+n"
close_workspace = "alt+shift+d"
workspace_picker = "alt+shift+s"
switch_workspace = "alt+shift+1..9"

# 4. Agent & Điều hướng nhanh
goto = "alt+g"
toggle_sidebar = "alt+b"
previous_agent = "alt+p"
next_agent = "alt+n"

# 5. Đổi tên (Rename)
rename_tab = "alt+shift+t"
rename_pane = "alt+shift+p"
rename_workspace = "alt+shift+w"

# 6. Tiện ích
copy_mode = "alt+c"

[[keys.command]]
key = "alt+ctrl+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"
