"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

format = """
$os\
[](fg:subtext0 bg:sapphire)\
$directory\
([](fg:sapphire bg:surface0)$git_branch$git_status\
$nodejs\
$bun\
$rust\
$golang\
$python\
$php\
$docker_context\
$aws\
$gcloud\
$cmd_duration\
$status\
$time)\
[](fg:surface0)\
$line_break\
$character"""

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:base bg:subtext0"

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[directory]
format = "[  $path ]($style)[$read_only]($style)"
style = "fg:base bg:sapphire"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "fg:peach bg:surface0"
only_attached = false

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "fg:subtext1 bg:surface0"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "-${count} "

[nodejs]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:teal bg:surface0"
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[bun]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:peach bg:surface0"

[rust]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:lavender bg:surface0"

[golang]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:sky bg:surface0"

[python]
symbol = "󰌠"
format = "[ $symbol $version ]($style)"
style = "fg:teal bg:surface0"

[php]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:mauve bg:surface0"

[docker_context]
symbol = "󰡨"
format = "[ $symbol $context ]($style)"
style = "fg:blue bg:surface0"
only_with_files = true

[aws]
symbol = "󰸏"
format = "([ $symbol $profile ]($style))"
style = "fg:peach bg:surface0"

[gcloud]
symbol = "󱇶"
format = "([ $symbol $account ]($style))"
style = "fg:lavender bg:surface0"

[cmd_duration]
min_time = 2_000
format = "[ 󱎫 $duration ]($style)"
style = "fg:subtext0 bg:surface0"

[status]
disabled = false
format = "[ ✘ $status ]($style)"
style = "fg:base bg:red"

[time]
disabled = false
time_format = "%R"
format = "[  $time ]($style)"
style = "fg:subtext1 bg:surface0"

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold sapphire)"

