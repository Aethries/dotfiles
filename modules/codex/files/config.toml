[mcp_servers."9remote".env_http_headers]
"x-9remote-session" = "NINE_REMOTE_SESSION_ID"

[mcp_servers."agent_memory"]
command = "npx"
args = ["-y", "@agentmemory/mcp@0.9.29"]
[mcp_servers."agent_memory".env]
