model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
approvals_reviewer = "user"
approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "default"

[tui]
theme = "noctalia"
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "thread-name", "project-name", "git-branch", "run-state", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 1
gpt-6-astra = 2
"gpt-6.1-sol" = 4

[mcp_servers."9remote"]
url = "http://127.0.0.1:2208/mcp"

[mcp_servers."9remote".http_headers]
Authorization = "Bearer a1a25b899f3364b59d26d16d9d5622f5c22af0e357563e377865723c2b039584"

[mcp_servers."9remote".env_http_headers]
x-9remote-session = "NINE_REMOTE_SESSION_ID"

[mcp_servers."atlassian"]
url = "https://mcp.atlassian.com/v2/mcp"

[mcp_servers."codebase_memory"]
command = "uvx"
args = ["codebase-memory-mcp"]

[mcp_servers."codegraph"]
command = "uvx"
args = ["code-review-graph", "mcp"]

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers."jev_local"]
command = "jev-mcp"
startup_timeout_sec = 30.0

[mcp_servers."jev_local".env]
JEV_ENDPOINT = "http://localhost:20128/v1/systemone"
JEV_MODEL = "oc/jev-1.13-free"

[mcp_servers."jira"]
url = "https://mcp.atlassian.com/v2/mcp"

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
preventSleepWhileRunning = true
hotkey-window-projectless-default-enabled = false
notifications-turn-mode = "always"
toys-confetti-enabled = false
external-agent-import-sync-enabled = true
appearanceTheme = "dark"
appearanceDarkCodeThemeId = "xcode"
usePointerCursors = true
reduced-motion-preference = "on"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "persistent"]
browser-show-full-url = false

[desktop.appearanceDarkChromeTheme]
accent = "#75a0d7"
accentSource = "custom"
contrast = 55
ink = "#f2f2f3"
opaqueWindows = true
surface = "#1a1e23"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"JetBrainsMono Nerd Font"'
ui = '"JetBrainsMono Nerd Font"'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#67b7a4"
diffRemoved = "#fc6a5d"
skill = "#75a0d7"

[features]
hooks = true
memories = true
js_repl = false

[memories]
generate_memories = true
use_memories = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true



