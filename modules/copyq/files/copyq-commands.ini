[Commands]
1\Command="copyq:
hide()
copy()
if (Env('WAYLAND_DISPLAY')) {
    exec('wtype', '-M', 'ctrl', '-k', 'v', '-m', 'ctrl')
} else {
    paste()
}"
1\Icon=\xf0ea
1\InMenu=false
1\Name=Auto Paste on Enter
1\Shortcut=Return
2\Command="copyq:
var pinned = 'Pinned'
var row = currentItem()
if (row >= 0) {
    var data = getItem(row)
    tab(pinned)
    setItem(0, data)
    tab(0)
}"
2\Icon=\xf08d
2\InMenu=true
2\Name=Pin Item
2\Shortcut=Ctrl+P
size=2
