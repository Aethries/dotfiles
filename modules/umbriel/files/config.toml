# ==============================================================================
# Umbriel Compositor Configuration
# Extends system default: /usr/share/umbriel/config.toml
# ==============================================================================

[include]
files = [
	"/usr/share/umbriel/config.toml",
	"keybinds.toml",
]

[general]
autostart = ["noctalia", "fcitx5 -d"]
mod_key = "super"
xwayland = true
show_cheatsheet = false

# ==============================================================================
# Layout
# ==============================================================================
[layout]
extent_presets = [0.333, 0.5, 0.667, 1.0]

# ==============================================================================
# Window Rules
# ==============================================================================
[[window_rule]]
match.app_id = "^(google-chrome.*|chromium.*|antigravity.*)$"
default_scrolling_extent = 1.0

# ==============================================================================
# Input & Caret Ergonomics
# ==============================================================================
[input.keyboard]
repeat_delay = 180
repeat_rate = 50

