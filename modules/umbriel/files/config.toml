# ==============================================================================
# Umbriel Compositor Configuration
# Extends system default: /usr/share/umbriel/config.toml
# ==============================================================================

[include]
files = [
	"/usr/share/umbriel/config.toml",
	"keybinds.toml",
]

[include.optional]
files = [
  "noctalia.toml",
]

[general]
autostart = ["noctalia", "fcitx5 -d", "coffee on"]
mod_key = "super"
xwayland = true
show_cheatsheet = false

# ==============================================================================
# Layout
# ==============================================================================
[layout]
extent_presets = [0.333, 0.5, 0.667, 1.0]

[layout.scrolling]
default_extent_fraction = 1.0

# ==============================================================================
# Window Rules
# ==============================================================================
# All tiled/scrolling windows default to 100% width
[[window_rule]]
default_scrolling_extent = 1.0

# Floating exceptions
[[window_rule]]
match.app_id = "^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|imv|mpv)$"
default_floating = true

[[window_rule]]
match.app_id = "^(org.freedesktop.impl.portal.desktop.*|xdg-desktop-portal.*|polkit-gnome-authentication-agent-1)$"
default_floating = true


# ==============================================================================
# Input & Caret Ergonomics
# ==============================================================================
[input.keyboard]
repeat_delay = 180
repeat_rate = 50

# ==============================================================================
# Outputs
# ==============================================================================
[output.HDMI-A-1]
mode = "1920x1080@120"
scale = 1.0



