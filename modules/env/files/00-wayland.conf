# ==============================================================================
# Wayland Core, Ozone & Portal Session Environment
# ==============================================================================

# Force Wayland Ozone for Chromium/Electron apps (Slack, Lark, Chrome)
ELECTRON_OZONE_PLATFORM_HINT=auto

# Firefox Wayland
MOZ_ENABLE_WAYLAND=1

# Qt Wayland & Force System Portal File Dialog (Telegram, Qt apps)
QT_QPA_PLATFORM="wayland;xcb"
QT_QPA_PLATFORMTHEME="qt6ct"
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_USE_PORTAL=1
TDESKTOP_USE_PORTAL=1

# Cursor Theme & Size
XCURSOR_THEME="catppuccin-latte-light-cursors"
XCURSOR_SIZE=24

# GTK & Clutter
GTK_THEME="adw-gtk3-dark"
GDK_BACKEND="wayland,x11,*"
CLUTTER_BACKEND=wayland

# SDL & Java
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1

# Fcitx5 Vietnamese Input Method for GUI
XMODIFIERS=@im=fcitx
QT_IM_MODULE=fcitx

# User Path
PATH="${HOME}/.local/bin:${HOME}/go/bin:${PATH}"
