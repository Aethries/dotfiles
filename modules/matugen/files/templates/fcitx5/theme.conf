[Metadata]
Name=Matugen
Version=1
Author=matugen
Description=Material 3 Expressive palette generated from the current wallpaper
ScaleWithDPI=True

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.on_primary.default.hex}}
HighlightBackgroundColor={{colors.primary.default.hex}}
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color={{colors.surface_container_high.default.hex}}
BorderColor={{colors.outline.default.hex}}
BorderWidth=2
