# ==============================================================================
# Kitty Configuration
# Synced with Noctalia Shell & Umbriel Wayland Compositor
# ==============================================================================

# ------------------------------------------------------------------------------
# Theme & Color Scheme
# ------------------------------------------------------------------------------
include themes/noctalia.conf

# Ghi đè màu selection để đảm bảo khối bôi đen/chọn văn bản có độ tương phản cao và rõ ràng
selection_background #7e9fe8
selection_foreground #151b28

# ------------------------------------------------------------------------------
# Fonts
# ------------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# ------------------------------------------------------------------------------
# Background, Transparency & Blur
# ------------------------------------------------------------------------------
# Độ trong suốt và hiệu ứng kính mờ (kết hợp với background-effect của Umbriel)
background_opacity 0.85
background_blur    32
dynamic_background_opacity yes

# ------------------------------------------------------------------------------
# Window Layout & Bar
# ------------------------------------------------------------------------------
hide_window_decorations yes
window_padding_width 0
placement_strategy   center
confirm_os_window_close 0

# ------------------------------------------------------------------------------
# Cursor & Trail Animations
# ------------------------------------------------------------------------------
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 1.8
cursor_underline_thickness 2.0

cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

cursor_trail 1
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 1
repaint_delay 10
input_delay 6

# ------------------------------------------------------------------------------
# Shell & Multiplexer Integration
# ------------------------------------------------------------------------------
shell_integration enabled no-cursor

# Single-surface mode
tab_bar_style hidden
enabled_layouts stack

# Keybindings
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+kp_add change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ------------------------------------------------------------------------------
# Misc Settings
# ------------------------------------------------------------------------------
scrollback_lines 10000
mouse_hide_wait  3.0
enable_audio_bell no
