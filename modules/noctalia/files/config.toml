# ==============================================================================
# Noctalia Desktop Shell Configuration
# ==============================================================================

[wallpaper]
enabled = true
fill_mode = "crop"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[notification]
enable_daemon = true
position = "top_right"
history_retention_hours = 24
keep_dismissed_in_history = true

[osd]
enabled = true
position = "top_center"
hide_delay_ms = 1400

[audio]
enable_sounds = true

# ==============================================================================
# Theme & Templates Synchronization
# ==============================================================================
[theme]
builtin = "Noctalia"
mode = "dark"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "ghostty", "umbriel", "starship", "gtk3", "gtk4", "qt", "kcolorscheme", "btop" ]
community_ids = [
	"antigravity",
	"bat",
	"fastfetch",
	"fcitx5",
	"fzf",
	"lazygit",
	"telegram",
	"ungoogled-chromium",
	"yazi",
	"zellij"
]
enable_builtin_templates = true
enable_community_templates = true


# ==============================================================================
# Plugins Management & Synchronization
# ==============================================================================
[plugins]
auto_update = "all"
enabled = [
	"noctalia/notes",
	"noctalia/umbriel-companion",
	"noctalia/screen_recorder",
	"noctalia/bitwarden",
	"noctalia/timer",
	"fel/ocr",
	"yocraft/qrcode",
	"nightwatch75/file-search",
	"oldirtty/color_picker",
	"autumn/network-toolkit",
	"davemhammer/tailscale",
	"liamwh/emoji-picker",
	"ashur-d/nvim-projects",
	"vn1k/cursor",
	"hy4ri/github-notifications",
	"tordex/processes"
]

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[plugin_settings."noctalia/screen_recorder"]
video_encoder = "cpu"
video_source = "focused"
filename_pattern = "%Y_%m_%d_%H_%M_%S"
