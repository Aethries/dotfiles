config_version = 14

[accessibility]
ui_scale = 0.90000000596046448

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.00006103515625
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/umbriel-companion",
    "noctalia/screen_recorder",
    "levi/warp",
    "oldirtty/color_picker",
    "vn1k/cursor",
    "liamwh/emoji-picker",
    "nightwatch75/file-search",
    "ramosdetrigo/godot-provider",
    "ashur-d/nvim-projects",
    "autumn/network-toolkit",
    "fel/ocr",
    "yocraft/qrcode",
    "cleboost/ssh-launcher",
    "davemhammer/tailscale"
]

[shell]
app_icon_color = "on_error"
card_borders = false
corner_radius_scale = 1.0500000156462193
font_family = "JetBrainsMono Nerd Font"

    [shell.animation]
    speed = 0.65000000968575478

    [shell.screen_corners]
    size = 28

    [shell.shadow]
    alpha = 0.13999999687075615

[theme]
builtin = "Gruvbox"
community_palette = "Tomorrow"
mode = "dark"

    [theme.templates]
    community_ids = [
        "antigravity",
        "claude-code",
        "codex",
        "telegram",
        "neovim",
        "obsidian",
        "vscode",
        "fastfetch",
        "zellij",
        "fcitx5",
        "fzf",
        "lazygit",
        "superfile",
        "yazi"
    ]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"