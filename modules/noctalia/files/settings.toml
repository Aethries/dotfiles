config_version = 15

[accessibility]
ui_scale = 0.90000000596046448

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.00006103515625
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."vn1k/cursor"]
manager_placement = "floating"
scale_filter = "point"

[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/umbriel-companion",
    "levi/warp",
    "oldirtty/color_picker",
    "vn1k/cursor",
    "liamwh/emoji-picker",
    "nightwatch75/file-search",
    "ramosdetrigo/godot-provider",
    "ashur-d/nvim-projects",
    "autumn/network-toolkit",
    "fel/ocr",
    "yocraft/qrcode",
    "cleboost/ssh-launcher",
    "davemhammer/tailscale",
    "noctalia/screen_recorder",
    "kjvdven/case-convert",
    "noctalia/bitwarden",
    "noctalia/timer",
    "hy4ri/github-notifications",
    "tordex/processes"
]

[shell]
app_icon_color = "on_error"
card_borders = false
clipboard_auto_paste = "ctrl_v"
clipboard_confirm_clear_history = false
clipboard_enabled = true
clipboard_history_max_entries = 10000
clipboard_keep_from_closed_apps = true
corner_radius_scale = 1.8500000275671482
font_family = "JetBrainsMono Nerd Font"
open_near_click_clipboard = true

    [shell.animation]
    speed = 0.65000000968575478

    [shell.screen_corners]
    size = 28

    [shell.shadow]
    alpha = 0.21999999508261681

[theme]
builtin = "Tokyo-Night"
community_palette = "One Dark Two"
custom_palette = "wallhaven-yqg6r7-mc"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "ghostty", "umbriel", "starship", "gtk3", "gtk4", "qt", "kcolorscheme", "btop" ]
    community_ids = [
        "antigravity",
        "claude-code",
        "codex",
        "ungoogled-chromium",
        "zen-browser",
        "telegram",
        "obsidian",
        "vscode",
        "zed",
        "fastfetch",
        "zellij",
        "fcitx5",
        "bat",
        "fzf",
        "lazygit",
        "superfile",
        "yazi"
    ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper.default]
path = "@HOME@/Pictures/wallhaven-6lpdjl_3840x2160.png"

[wallpaper.last]
path = "@HOME@/Pictures/wallhaven-6lpdjl_3840x2160.png"

[wallpaper.monitors.HDMI-A-1]
path = "@HOME@/Pictures/wallhaven-6lpdjl_3840x2160.png"