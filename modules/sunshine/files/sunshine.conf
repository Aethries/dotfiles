# ==============================================================================
# Sunshine Remote Desktop Configuration (~/.config/sunshine/sunshine.conf)
# ==============================================================================

# Network & Web UI
origin_web_ui_allowed = wan
address = 0.0.0.0
port = 47989
csrf_allowed_origins = https://100.75.135.107:47990

# GPU Encoder & Display Resolution (Intel UHD Graphics 770 / VA-API)
encoder = vaapi
fps = [60, 120]
resolutions = [
	1920x1080,
	2560x1440,
	3840x2160
]

# Audio & Input
audio_sink = auto
channels = 2
back_button_behavior = 0

# Security & Behavior
origin_pin_allowed = wan
exit_action = "noctalia msg session lock"
