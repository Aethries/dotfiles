# ==============================================================================
# Sunshine Remote Desktop Configuration (~/.config/sunshine/sunshine.conf)
# ==============================================================================

# Network & Web UI
origin_web_ui_allowed = wan
port = 47989
# Keep the default CSRF protection; no machine-specific Tailscale IP.

# Umbriel supports native wlr screencopy, without CAP_SYS_ADMIN or a portal picker.
capture = wlr
# Leave encoder unset so Sunshine selects an encoder for this machine's GPU.
# Resolution and frame rate are requested by Moonlight.
system_tray = disabled

# Audio & Input
# Leave audio_sink unset to use the default PipeWire/PulseAudio device.
