[accessibility]
ui_scale = 0.90000000596046448

[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.4999999888241291

[backdrop]
blur_intensity = 0.81999998167157173
tint_intensity = 0.30999999307096004

[bar.default]
background_opacity = 0.87999998033046722
border = "on_primary"
capsule = true
capsule_fill = "on_primary"
capsule_foreground = "primary"
capsule_opacity = 0.59999998658895493
capsule_radius = 12
capsule_thickness = 0.74999998696148396
center = [ "control-center", "clock", "date" ]
color = "primary"
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "session" ]
font_scale = 0.89999998733401299
font_weight = 600
layer = "overlay"
margin_ends = 120
padding = 4
radius = 12
scale = 0.95000000670552254
shadow = false
start = [ "warp", "keymap", "weather", "workspaces" ]
thickness = 32

[calendar]

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 900

    [control_center.calendar]
    show_events_card = true

[dock]
background_opacity = 0.50999998860061169
enabled = false
icon_size = 40
inactive_opacity = 0.84999998100101948
item_spacing = 8
layer = "overlay"
magnification_scale = 1.800000011920929
main_axis_padding = 8
monitors = [ "HDMI-A-2" ]
pinned = [ "google-chrome", "antigravity-ide", "kitty" ]
radius = 12
radius_top_left = 16
reserve_space = false
shadow = false
show_instance_count = false
smart_auto_hide = true

[hot_corners.bottom_left]
action = "launcher"

[hot_corners.bottom_right]
action = "launcher"

[hot_corners.top_left]
action = "launcher"

[hot_corners.top_right]
action = "launcher"

[location]
address = "Ha Noi, Viet Nam"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.78999998234212399
scale = 0.90000000596046448

[osd]
background_opacity = 0.79999998211860657
orientation = "horizontal"

[plugin_settings."noctalia/screen_recorder"]
filename_pattern = "recording_%d%m%y_%H%M"
video_encoder = "cpu"

[plugins]
auto_update = "all"
enabled = [
    "salemsayed/niri-active-workspace",
    "noctalia/screen_recorder",
    "kjvdven/case-convert",
    "levi/warp",
    "oldirtty/color_picker",
    "tadomika_ari/config-swap",
    "liamwh/emoji-picker",
    "tphilippot/git_companion",
    "raycursive/github-prs",
    "ramosdetrigo/godot-provider",
    "noctalia/kaomoji",
    "kenn/keybind-cheatsheet",
    "blackbartblues/keymap",
    "8bury/mini-docker",
    "ashur-d/nvim-projects",
    "noctalia/notes",
    "decksters-lab/palette-creator",
    "icefish/phone-connect",
    "yocraft/qrcode",
    "yocraft/web-launcher",
    "noctalia/bongocat",
    "umedbazarov/webapp-maker",
    "notfinaldev/web-search"
]

[shell]
button_borders = false
card_borders = false
clipboard_confirm_clear_history = false
clipboard_history_max_entries = 10000
corner_radius_scale = 1.2000000178813934
font_family = "JetBrainsMono NF"
input_borders = false
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
popup_borders = false
popup_shadows = false
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.animation]
    speed = 0.5000000074505806

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    show_app_actions = true

    [shell.panel]
    control_center_placement = "attached"
    floating_layer = "overlay"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.screenshot]
    confirm_region = true
    pipe_to_command = true
    remember_last_region = true
    show_cursor = true

    [shell.shadow]
    alpha = 0.4999999888241291
    direction = "center"

    [shell.window_switcher]
    mru = true

[system.monitor]
cpu_poll_seconds = 15
disk_poll_seconds = 15
gpu_poll_seconds = 15
memory_poll_seconds = 15
network_poll_seconds = 15

[theme]
builtin = "Ayu"
community_palette = "GitHub Dark"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "starship" ]
    community_ids = [
        "antigravity",
        "bat",
        "fastfetch",
        "fcitx5",
        "fzf",
        "lazygit",
        "neovim",
        "obsidian",
        "telegram",
        "ungoogled-chromium",
        "vscode",
        "yazi",
        "zellij"
    ]

        [theme.templates.user.palette_creator_live]
        input_path = "~/.local/state/noctalia/plugins/materialized/community/palette-creator/templates/live-snapshot.tpl"
        output_path = "~/.local/state/noctalia/plugin-data/kyle-palette-creator/live-snapshot.json"

[wallpaper]
edge_smoothness = 0.47999998927116394
fill_color = "primary"
transition_duration = 3800
transition_on_startup = true

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/1354305.jpeg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/1354305.jpeg"

    [wallpaper.monitor.HDMI-A-2]
    fill_color = "primary"

    [wallpaper.monitors.HDMI-A-1]
    path = "~/Pictures/Wallpapers/1354305.jpeg"

    [wallpaper.monitors.HDMI-A-2]
    path = "~/Pictures/Wallpapers/1354305.jpeg"

[widget.clock]
scroll_repeat = "gesture"

[widget.date]
format = "{:%A %d thg %m %Y}"

[widget.warp]
type = "levi/warp:warp"
