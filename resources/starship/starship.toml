"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

# ==============================================================================
# Catppuccin Powerline Ribbon (Exact Match to Reference Image 2)
# Synced with Noctalia Palette
# ==============================================================================

format = """
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:lavender)\
$time\
[ ](fg:lavender)\
$character"""

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Linux = "  "
NixOS = "  "
Ubuntu = " 󰕈 "
Arch = " 󰣇 "
Debian = " 󰣚 "
Macos = "  "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user ]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:green) '
error_symbol = '[❯](bold fg:red) '
vimcmd_symbol = '[❮](bold fg:green) '
vimcmd_replace_one_symbol = '[❮](bold fg:lavender) '
vimcmd_replace_symbol = '[❮](bold fg:lavender) '
vimcmd_visual_symbol = '[❮](bold fg:yellow) '

