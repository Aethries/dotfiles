# ==============================================================================
# Kitty Configuration
# Synced with Noctalia Shell & Niri Wayland Compositor
# ==============================================================================

# ------------------------------------------------------------------------------
# Theme & Color Scheme
# ------------------------------------------------------------------------------
# Tự động đồng bộ màu sắc với Noctalia Shell qua template
include themes/noctalia.conf

# Ghi đè màu selection để đảm bảo khối bôi đen/chọn văn bản có độ tương phản cao và rõ ràng
selection_background #7e9fe8
selection_foreground #151b28

# ------------------------------------------------------------------------------
# Fonts
# ------------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# ------------------------------------------------------------------------------
# Background, Transparency & Blur
# ------------------------------------------------------------------------------
# Độ trong suốt và hiệu ứng kính mờ (kết hợp với background-effect của Niri)
background_opacity 0.85
background_blur    32
dynamic_background_opacity yes

# ------------------------------------------------------------------------------
# Window Layout & Bar
# ------------------------------------------------------------------------------
# Ẩn hoàn toàn thanh tiêu đề / window decorations
hide_window_decorations yes

# Khoảng đệm viền bên trong cửa sổ: top 2, right 8, bottom 2, left 0 (dính sát lề trái)
window_padding_width 2 8 2 0
placement_strategy   center

# Xác nhận khi đóng cửa sổ
confirm_os_window_close 0

# ------------------------------------------------------------------------------
# Cursor & Trail Animations
# ------------------------------------------------------------------------------
# Hình dạng con trỏ mặc định là block, hỗ trợ thin (beam) cho vim mode sau này
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 1.8
cursor_underline_thickness 2.0

# Hiệu ứng nhấp nháy êm dịu (smooth ease-in-out blink)
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

# Vệt đuôi con trỏ chuyển động mượt mà (Cursor Trail & Caret Smooth Animation khi gõ)
cursor_trail 1
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 1
repaint_delay 10
input_delay 6

# Kitty chỉ là terminal renderer. Mỗi cửa sổ khởi chạy launcher script độc lập
# để chọn, khôi phục hoặc tạo session có tên trước khi khởi tạo Zellij.
shell ~/.config/zellij/scripts/launcher.sh

# Không để shell integration ghi đè hình dạng con trỏ thành beam tại dấu nhắc lệnh,
# bảo đảm phân biệt rõ ràng block (Normal mode) và thin beam (Insert mode) trong Vim/Shell
shell_integration enabled no-cursor

# ------------------------------------------------------------------------------
# Single-surface mode: Kitty renders, Zellij multiplexes
# ------------------------------------------------------------------------------
# Không hiển thị hoặc sử dụng tab/window/split nội bộ của Kitty.
tab_bar_style hidden
enabled_layouts stack

# Xóa shortcut mặc định để Kitty không chặn Ctrl+Shift của Zellij. Chỉ giữ
# clipboard ở lớp terminal; scrollback, search, tab, pane và resize thuộc Zellij.
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ------------------------------------------------------------------------------
# Misc Settings
# ------------------------------------------------------------------------------
scrollback_lines 10000
mouse_hide_wait  3.0
enable_audio_bell no
